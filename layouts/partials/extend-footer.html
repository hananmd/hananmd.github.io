<div id="particles-js"></div>
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script>
particlesJS("particles-js", {
  particles: {
    number: { value: 100, density: { enable: true, value_area: 900 } },
    color: { value: ["#00ff88", "#00cfff", "#7b61ff"] },
    shape: { type: "circle" },
    opacity: {
      value: 0.6,
      random: true,
      anim: { enable: true, speed: 0.5, opacity_min: 0.1 }
    },
    size: {
      value: 2.5,
      random: true,
      anim: { enable: true, speed: 1, size_min: 0.5 }
    },
    line_linked: {
      enable: true,
      distance: 140,
      color: "#00ff88",
      opacity: 0.15,
      width: 1
    },
    move: {
      enable: true,
      speed: 1.5,
      direction: "none",
      random: true,
      straight: false,
      out_mode: "out",
      bounce: false
    }
  },
  interactivity: {
    detect_on: "canvas",
    events: {
      onhover: { enable: true, mode: "grab" },
      onclick: { enable: true, mode: "push" }
    },
    modes: {
      grab: { distance: 180, line_linked: { opacity: 0.5 } },
      push: { particles_nb: 5 }
    }
  },
  retina_detect: true
});
</script>
