baseURL = "https://hananmd.github.io/"
languageCode = "en-us"
title = "Hanan's Tech Blog"
theme = "PaperMod"

enableEmoji = true

[params]
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  
  # Social Links (Optional - Add your LinkedIn/GitHub later)
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/hananmd"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/hanan-mohamed-b460782b2/"
[outputs]
  home = ["HTML", "RSS", "JSON"]
